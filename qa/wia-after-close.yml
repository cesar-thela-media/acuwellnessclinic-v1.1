    - main [ref=f20e8]:
      - article [ref=f20e9]:
        - generic [ref=f20e10]:
          - heading "What Is Acupuncture?" [level=1] [ref=f20e13]
          - generic [ref=f20e15]:
            - paragraph [ref=f20e17]: Acupuncture is the insertion of very thin, filiform needles into specific points on the body to relieve pain or treat disease. In the US, acupuncture is the most well-known modality of traditional Chinese medicine. Here it is most often used to treat pain, however acupuncture promotes healing reactions in the body. It is a complete medical system capable of treating many conditions beyond pain. It enhances recuperative power and immunity, supporting physical and emotional health, and improving overall function and well-being. It is a safe and effective way to treat a wide variety of medical problems and is extremely complementary to allopathic medicine.
            - paragraph [ref=f20e18]: As a whole, Chinese medicine looks at illness holistically and often sees patterns in a way which is very different from allopathic medicine. Western medicine typically views an illness as it relates to a particular system and often does not link symptoms across systems together. Chinese medicine looks for the relationships between the patient's signs and symptoms and treats the body in a holistic fashion.
          - generic [ref=f20e20]:
            - heading "What is Qi?" [level=2] [ref=f20e21]
            - paragraph [ref=f20e22]: Qi (pronounced "chee") is the energy, or life force, involved in every aspect of the body. Qi is at the core of Chinese medicine and flows throughout the body. For the most part, it is common knowledge that our body's function off of energy being transmitted. In the most simplistic sense this energy is the Qi. Qi animates the body and protects it from illness, pain and disease. A person's health is influenced by the quality, quantity and balance of Qi.
          - generic [ref=f20e24]:
            - heading "How does Qi move?" [level=2] [ref=f20e25]
            - paragraph [ref=f20e26]: Qi flows through specific pathways called meridians. Meridian pathways are like rivers flowing inside the body. This is a very apt parallel since where a river flows, it provides nourishment to the land, plants and people. Similarly, where meridian pathways flow, they bring Qi that provides nourishment to every cell, organ, tissue and muscle in the body.
            - paragraph [ref=f20e27]: Physical and emotional trauma, stress, lack of exercise, overexertion, seasonal changes, poor diet, accidents, or excessive activity are among the many things that can influence the quality, quantity and balance of Qi. A change or blockage in the flow of Qi can be detrimental to a person's health, limiting vital nourishment to the body, organs and glands. Think of a rock blocking a river or a kink in a hose. The water gets dammed up on one side and the things downstream begin to wither. Our body's act similarly. Where there is free flow of qi, there is no pain.
            - paragraph [ref=f20e28]: Normally, when a blockage or imbalance occurs, the body easily bounces back, returning to a state of health and well-being. However, when this disruption is prolonged or excessive, or if the body is in a weakened state, illness, pain, or disease can set in. This is generally based on the resources available in the body to help it repair.
            - paragraph [ref=f20e29]: Blockage of the flow of Qi can be detrimental to a person's health and leads to various signs and symptoms or health concerns.
          - generic [ref=f20e31]:
            - heading "How does Acupuncture Work?" [level=2] [ref=f20e32]
            - paragraph [ref=f20e33]: Acupuncture needles inserted at specific points on the body access, redirect, and boost Qi in the meridians helping the body to reach the highest capacity to heal its self. Modern research shows us that our brains recognize when a needle has been inserted and it responds. There are both local responses and systemic ones involved, both of which encourage the body to begin the healing process. The human body has a vast capacity to heal its self, sometimes all it needs is a little help. Acupuncture provides a safe, effective and drug-free therapy needed to bring the body back to balance and health.
            - paragraph [ref=f20e34]: Acupuncture and Chinese medicine are safe, effective and drug-free therapies that can help address a wide variety of common ailments and problems.
